sonar.projectKey=Les-Chauffagistes_Shop
sonar.projectName=Shop
sonar.organization=les-chauffagistes

sonar.sources=src,prisma/seed.ts
sonar.tests=tests,e2e
sonar.test.inclusions=**/*.test.ts,tests/**,e2e/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Migrations SQL générées par Prisma : on ne les modifie pas après application.
sonar.exclusions=prisma/migrations/**
sonar.cpd.exclusions=tests/**,e2e/**
